<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3a1b0b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NZ Newsstand">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<title>NZ Newsstand</title>
<style>
  :root {
    --bg-top: #4a250f;
    --bg-bottom: #1d0f09;
    --chrome-top: #806652;
    --chrome-mid: #624735;
    --chrome-bottom: #402d22;
    --chrome-line: rgba(48, 31, 21, 0.92);
    --chrome-text: #fff8ee;
    --chrome-shadow: rgba(28, 19, 14, 0.62);
    --button-top: #aa805d;
    --button-mid: #82583a;
    --button-bottom: #563621;
    --button-edge: #422817;
    --button-highlight: rgba(255, 255, 255, 0.5);
    --button-pressed-top: #7c4d30;
    --button-pressed-bottom: #4f301d;
    --button-disabled-top: #887366;
    --button-disabled-bottom: #665044;
    --cover-border: rgba(70, 52, 36, 0.55);
    --cover-shadow: rgba(31, 13, 3, 0.52);
    --cover-sheen: rgba(255, 255, 255, 0.36);
    --fallback-bg: rgba(245, 241, 230, 0.88);
    --fallback-text: #5f5041;
    --toast-bg: rgba(37, 26, 17, 0.82);
    --toast-error: rgba(120, 32, 22, 0.92);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--chrome-text);
    position: relative;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    background:
      radial-gradient(circle at 50% 18%, rgba(205, 141, 78, 0.24), transparent 30%),
      radial-gradient(circle at 50% 58%, rgba(148, 84, 34, 0.2), transparent 38%),
      linear-gradient(180deg, #54260d 0%, #3a1b0b 44%, #261208 100%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 44%, rgba(227, 171, 101, 0.14), transparent 32%),
      radial-gradient(circle at 50% 44%, rgba(116, 61, 20, 0.22), transparent 58%),
      linear-gradient(90deg, rgba(24, 10, 4, 0.34) 0%, transparent 12%, transparent 88%, rgba(24, 10, 4, 0.34) 100%);
    z-index: 0;
  }

  img {
    display: block;
    max-width: 100%;
  }

  button,
  input {
    font: inherit;
  }

  button,
  input,
  .paper-image {
    -webkit-tap-highlight-color: transparent;
  }

  button,
  .paper-image {
    touch-action: manipulation;
  }

  [hidden] {
    display: none !important;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .app-shell {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: 6px 0 8px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .control-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 8px;
    margin-bottom: 8px;
    border-radius: 15px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, transparent 24%),
      linear-gradient(180deg, rgba(128, 102, 82, 0.94) 0%, rgba(98, 71, 53, 0.92) 56%, rgba(64, 45, 34, 0.96) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      inset 0 -1px 0 rgba(12, 20, 31, 0.16),
      0 5px 12px rgba(0, 0, 0, 0.12);
    width: min(660px, calc(100vw - 42px));
    margin: 0 auto 5px;
    backdrop-filter: blur(3px);
    position: relative;
    z-index: 5;
    flex: 0 0 auto;
  }

  .ios6-btn,
  .date-shell {
    border-radius: 10px;
    border: 1px solid var(--button-edge);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.26),
      inset 0 -1px 0 rgba(18, 29, 44, 0.22),
      0 1px 0 rgba(12, 20, 31, 0.22);
  }

  .ios6-btn {
    position: relative;
    min-height: 29px;
    padding: 0 12px;
    color: var(--chrome-text);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-shadow: 0 -1px 0 rgba(10, 18, 26, 0.62);
    border-radius: 10px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 42%, transparent 42%),
      linear-gradient(180deg, rgba(170, 128, 93, 0.96) 0%, rgba(130, 88, 58, 0.96) 54%, rgba(86, 54, 33, 0.99) 100%);
    cursor: pointer;
  }

  .ios6-btn:hover:not(:disabled) {
    filter: brightness(1.04);
  }

  .ios6-btn:active:not(:disabled) {
    transform: translateY(1px);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 42%, transparent 42%),
      linear-gradient(180deg, var(--button-pressed-top) 0%, var(--button-pressed-bottom) 100%);
    box-shadow:
      inset 0 2px 4px rgba(12, 20, 31, 0.28),
      0 1px 0 rgba(12, 20, 31, 0.2);
  }

  .ios6-btn:disabled {
    cursor: not-allowed;
    color: rgba(245, 247, 250, 0.7);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 42%, transparent 42%),
      linear-gradient(180deg, var(--button-disabled-top) 0%, var(--button-disabled-bottom) 100%);
    text-shadow: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 1px 0 rgba(12, 20, 31, 0.22);
  }

  .ios6-btn.is-today {
    min-width: 62px;
  }

  .date-shell {
    min-width: 176px;
    padding: 0 8px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 36%, transparent 36%),
      linear-gradient(180deg, rgba(96, 65, 45, 0.97) 0%, rgba(62, 40, 27, 0.99) 100%);
  }

  .date-shell input[type="date"] {
    width: 100%;
    min-height: 29px;
    color: var(--chrome-text);
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: transparent;
    border: 0;
    outline: none;
  }

  .date-shell input[type="date"]::-webkit-calendar-picker-indicator {
    opacity: 0.95;
    cursor: pointer;
    filter: invert(1) brightness(1.15);
  }

  .settings-menu {
    position: relative;
    flex: 0 0 auto;
  }

  .settings-toggle {
    min-width: 32px;
    width: 32px;
    padding: 0;
    display: grid;
    place-items: center;
  }

  .settings-icon {
    width: 15px;
    height: 15px;
    opacity: 0.92;
    pointer-events: none;
  }

  .settings-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: min(240px, calc(100vw - 26px));
    padding: 10px 10px 8px;
    border-radius: 13px;
    border: 1px solid rgba(58, 42, 32, 0.96);
    color: var(--chrome-text);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 26%, transparent 26%),
      linear-gradient(180deg, rgba(99, 70, 49, 0.98) 0%, rgba(58, 39, 27, 0.99) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      0 14px 28px rgba(0, 0, 0, 0.28);
    z-index: 12;
  }

  .settings-title {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(244, 247, 252, 0.9);
  }

  .settings-list {
    display: grid;
    gap: 6px;
  }

  .settings-item {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 30px;
    padding: 6px 8px;
    width: 100%;
    border: 0;
    border-radius: 9px;
    color: inherit;
    text-align: left;
    cursor: pointer;
    background: rgba(34, 23, 17, 0.24);
  }

  .settings-item:hover:not(:disabled) {
    background: rgba(52, 35, 26, 0.4);
  }

  .settings-item:disabled {
    cursor: default;
  }

  .settings-mark {
    width: 14px;
    height: 14px;
    border-radius: 999px;
    border: 1px solid rgba(227, 235, 244, 0.72);
    background: rgba(210, 157, 101, 0.96);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    flex: 0 0 auto;
  }

  .settings-item.is-off .settings-mark {
    background: transparent;
    opacity: 0.7;
  }

  .settings-item span:last-child {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
  }

  .settings-item.is-disabled span {
    opacity: 0.72;
  }

  .settings-note {
    margin: 8px 2px 0;
    font-size: 10px;
    color: rgba(235, 241, 248, 0.72);
  }

  .newsstand-scene {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100vw;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
    border-radius: 0;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(33, 16, 7, 0.18), rgba(33, 16, 7, 0.05)),
      url("./background-single.png") center center / 100% 100% no-repeat;
    box-shadow:
      0 0 0 1px rgba(103, 62, 28, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      inset 0 22px 36px rgba(57, 25, 7, 0.14),
      0 24px 46px rgba(0, 0, 0, 0.32),
      0 0 90px rgba(124, 74, 28, 0.18);
    container-type: size;
  }

  .newsstand-scene::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(58, 23, 5, 0.26) 0%, transparent 20%, transparent 70%, rgba(26, 11, 3, 0.16) 100%),
      linear-gradient(90deg, rgba(44, 20, 6, 0.28) 0%, transparent 7%, transparent 93%, rgba(44, 20, 6, 0.28) 100%),
      radial-gradient(circle at 50% 12%, rgba(255, 227, 169, 0.11), transparent 34%);
    pointer-events: none;
  }

  .newsstand-scene::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow:
      inset 0 -30px 42px rgba(30, 12, 3, 0.26),
      inset 26px 0 34px rgba(58, 24, 6, 0.18),
      inset -26px 0 34px rgba(58, 24, 6, 0.18);
    pointer-events: none;
    z-index: 1;
  }

  .shelf-papers {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .paper-card {
    position: absolute;
    left: var(--slot-left);
    bottom: var(--slot-bottom);
    width: min(var(--paper-width), calc(60cqh * 5 / 7));
    transform: translateX(-50%);
  }

  .paper-cover-wrap {
    position: relative;
    transform: rotate(var(--cover-rotate));
    transform-origin: bottom center;
    z-index: var(--slot-depth);
  }

  .paper-shadow {
    position: absolute;
    inset: auto -3% -13px -2%;
    height: 31px;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 48% 16%, rgba(41, 20, 7, 0.38) 0%, rgba(41, 20, 7, 0.25) 30%, rgba(41, 20, 7, 0.12) 52%, rgba(41, 20, 7, 0.04) 68%, rgba(41, 20, 7, 0) 84%);
    filter: blur(7px);
    transform: translateX(5px) scaleX(0.99);
    opacity: 0.76;
    z-index: 0;
    pointer-events: none;
  }

  .paper-shadow::after {
    content: "";
    position: absolute;
    top: 0;
    left: 1%;
    right: 3%;
    height: 5px;
    border-radius: 50%;
    background: rgba(31, 14, 4, 0.4);
    filter: blur(1.8px);
  }

  .paper-cover {
    position: relative;
    aspect-ratio: 5 / 7;
    overflow: hidden;
    border-radius: 0;
    border: 1px solid var(--cover-border);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(251, 249, 243, 0.98));
    box-shadow:
      1px 2px 3px rgba(42, 21, 8, 0.26),
      4px 9px 15px rgba(42, 21, 8, 0.19),
      10px 22px 36px rgba(42, 21, 8, 0.13),
      0 3px 3px rgba(35, 16, 5, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.78);
    z-index: 1;
  }

  .paper-cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(122deg, rgba(255, 255, 255, 0) 25%, var(--cover-sheen) 42%, rgba(255, 255, 255, 0) 59%);
    opacity: 0.28;
    pointer-events: none;
  }

  .paper-card.is-loading .paper-cover::after {
    animation: sheen-slide 1.15s linear infinite;
    opacity: 0.58;
  }

  @keyframes sheen-slide {
    from {
      transform: translateX(-42%);
    }
    to {
      transform: translateX(46%);
    }
  }

  .paper-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #f8f7f1;
    opacity: 0;
    transition: opacity 160ms ease;
    cursor: zoom-in;
  }

  .paper-image.is-visible {
    opacity: 1;
  }

  .paper-fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 18px;
    text-align: center;
    color: var(--fallback-text);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.3)),
      repeating-linear-gradient(
        180deg,
        rgba(77, 62, 48, 0.06) 0,
        rgba(77, 62, 48, 0.06) 1px,
        transparent 1px,
        transparent 8px
      );
  }

  .paper-toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 28px);
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #fdfdfd;
    text-align: center;
    background: var(--toast-bg);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
    z-index: 2;
  }

  .paper-toast.is-error {
    background: var(--toast-error);
  }

  .paper-controls {
    position: absolute;
    top: calc(100% + 48px);
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) 38px;
    gap: 6px;
    align-items: center;
    width: min(88%, 220px);
    z-index: 6;
  }

  .ios6-mini {
    min-height: 34px;
    padding: 0;
    font-size: 18px;
    line-height: 1;
  }

  .page-indicator {
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    border-radius: 11px;
    border: 1px solid rgba(65, 45, 34, 0.94);
    color: #eff4fb;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-shadow: 0 -1px 0 rgba(10, 18, 26, 0.7);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03) 44%, transparent 44%),
      linear-gradient(180deg, #80573a 0%, #513420 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.24),
      0 2px 0 rgba(12, 20, 31, 0.22);
  }

  .paper-card.is-loading .page-indicator {
    color: #fbf3d3;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 8px;
    background: rgba(15, 10, 6, 0.78);
    z-index: 20;
  }

  .lightbox[hidden] {
    display: none !important;
  }

  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    min-width: 34px;
    min-height: 34px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    font-size: 16px;
    color: #fff;
    line-height: 1;
    z-index: 1;
    background: rgba(15, 10, 6, 0.56);
    box-shadow: none;
    text-shadow: none;
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    min-width: 38px;
    min-height: 38px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    font-size: 18px;
    line-height: 1;
    color: #fff;
    background: rgba(15, 10, 6, 0.42);
    box-shadow: none;
    text-shadow: none;
    z-index: 1;
  }

  .lightbox-nav:disabled {
    opacity: 0.38;
    cursor: default;
  }

  .lightbox-nav-prev {
    left: 16px;
  }

  .lightbox-nav-next {
    right: 16px;
  }

  .lightbox-spread {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    align-items: start;
    width: min(calc(100vw - 16px), 1200px);
    max-width: 100%;
  }

  .lightbox-spread.is-cover {
    grid-template-columns: minmax(0, 1fr);
    width: min(calc(100vw - 16px), 900px);
  }

  .lightbox-image {
    display: block;
    width: 100%;
    max-height: 98vh;
    object-fit: contain;
    background: transparent;
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.34);
  }

  .lightbox-status {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    max-width: calc(100vw - 140px);
    padding: 8px 12px;
    border-radius: 10px;
    color: #fff;
    background: rgba(15, 10, 6, 0.78);
    font-size: 14px;
    text-align: center;
    z-index: 2;
  }

  /* The phone reader is a separate interaction surface. It stays out of the
     desktop layout entirely and is enabled only by the final phone breakpoint. */
  .mobile-reader {
    display: none;
  }

  .paper-image[role="button"]:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 3px solid #ffd36a;
    outline-offset: 3px;
  }

  @media (max-width: 1080px) {
    .app-shell {
      width: 100%;
      padding-top: 8px;
    }

    .control-bar {
      gap: 10px;
    }

    .ios6-btn {
      padding: 0 14px;
    }
  }

  @media (max-width: 860px) {
    .app-shell {
      height: 100vh;
      height: 100dvh;
      padding-top: calc(8px + env(safe-area-inset-top));
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .control-bar {
      justify-content: stretch;
      gap: 10px;
      flex: 0 0 auto;
    }

    .date-shell {
      order: -1;
      width: 100%;
    }

    .ios6-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 0 8px;
    }

    .settings-menu {
      flex: 0 0 auto;
      margin-left: auto;
    }

    .newsstand-scene {
      aspect-ratio: auto;
      height: auto;
      width: 100%;
      max-width: none;
      flex: 1 1 auto;
      min-height: 0;
      background: none;
      box-shadow: none;
      overflow: visible;
    }

    /* Drop the decorative shelf on phones — papers read better on the plain backdrop. */
    .newsstand-scene::before,
    .newsstand-scene::after {
      display: none;
    }

    .shelf-papers {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding: 8px 0;
      padding-inline: calc((100% - min(94vw, 420px, calc((100cqh - 132px) * 5 / 7))) / 2);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
    }

    .shelf-papers::-webkit-scrollbar {
      display: none;
    }

    .paper-card {
      position: relative;
      left: auto;
      bottom: auto;
      width: min(94vw, 420px, calc((100cqh - 132px) * 5 / 7));
      min-width: min(94vw, 420px, calc((100cqh - 132px) * 5 / 7));
      transform: none;
      flex: 0 0 auto;
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }

    .paper-controls {
      top: calc(100% + 18px);
      width: min(86%, 220px);
    }
  }

  @media (max-width: 520px) {
    .app-shell {
      width: 100%;
    }

    .control-bar {
      padding: 12px;
      border-radius: 18px;
      width: min(560px, calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right)));
    }

    .ios6-btn,
    .date-shell input[type="date"] {
      min-height: 44px;
      font-size: 15px;
    }

    .newsstand-scene {
      border-radius: 0;
    }

    .shelf-papers {
      padding-top: 8px;
      padding-bottom: 8px;
      gap: 12px;
    }

    .ios6-mini {
      min-height: 40px;
      font-size: 20px;
    }

    .page-indicator {
      min-height: 40px;
      font-size: 12px;
    }

    .paper-controls {
      top: calc(100% + 26px);
    }
  }

  /* Phone reader: one full-width page at a time, thumb-reachable controls. */
  @media (max-width: 700px), (max-height: 500px) and (pointer: coarse) {
    body {
      overscroll-behavior: none;
    }

    .app-shell {
      height: var(--mobile-viewport-height, 100dvh);
      max-height: var(--mobile-viewport-height, 100dvh);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .newsstand-scene {
      display: none;
    }

    .mobile-reader {
      position: relative;
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      touch-action: pan-y pinch-zoom;
      background:
        radial-gradient(circle at 50% 22%, rgba(226, 164, 101, 0.13), transparent 34%),
        linear-gradient(180deg, #3d1d0d 0%, #211009 100%);
      -webkit-overflow-scrolling: touch;
    }

    .mobile-reader::-webkit-scrollbar {
      display: none;
    }

    .mobile-paper {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      place-items: center;
      width: 100%;
      height: 100%;
      min-height: 100%;
      padding: 48px 10px 64px;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .mobile-paper-image {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 160ms ease, transform 180ms ease;
      filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.3));
      user-select: none;
      -webkit-user-drag: none;
    }

    .mobile-paper-image.is-visible {
      opacity: 1;
    }

    .mobile-paper.is-changing .mobile-paper-image {
      transform: scale(0.985);
    }

    .mobile-paper-topline,
    .mobile-paper-controls,
    .mobile-paper-status {
      position: absolute;
      z-index: 2;
      color: #fffaf3;
      background: rgba(31, 17, 10, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .mobile-paper-topline {
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .mobile-paper-position {
      flex: 0 0 auto;
      color: rgba(255, 250, 243, 0.72);
    }

    .mobile-paper-controls {
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 46px minmax(92px, auto) 46px;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
    }

    .mobile-page-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      font-size: 22px;
      font-weight: 700;
    }

    .mobile-page-button:disabled {
      opacity: 0.35;
    }

    .mobile-page-label {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .mobile-paper-status {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: calc(100% - 48px);
      padding: 9px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
    }

    .mobile-paper-status.is-error {
      background: rgba(116, 29, 20, 0.9);
    }

    .lightbox {
      padding: 0;
    }

    .lightbox-spread,
    .lightbox-spread.is-cover {
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      width: 100vw;
      padding: 0 6px;
      place-items: center;
    }

    .lightbox-image {
      max-height: 98vh;
      max-height: calc(100dvh - 12px);
      box-shadow: none;
    }

    .lightbox-close {
      top: calc(10px + env(safe-area-inset-top));
      right: calc(10px + env(safe-area-inset-right));
      min-width: 44px;
      min-height: 44px;
      font-size: 17px;
      background: rgba(15, 10, 6, 0.62);
    }

    .lightbox-nav {
      top: auto;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: none;
      min-width: 52px;
      min-height: 52px;
      font-size: 22px;
      background: rgba(15, 10, 6, 0.55);
    }

    .lightbox-nav:active:not(:disabled) {
      background: rgba(15, 10, 6, 0.78);
    }

    .lightbox-nav-prev {
      left: calc(16px + env(safe-area-inset-left));
    }

    .lightbox-nav-next {
      right: calc(16px + env(safe-area-inset-right));
    }
  }
</style>
</head>
<body>
<main class="app-shell">
  <h1 class="sr-only">New Zealand Newsstand</h1>

  <header class="control-bar" aria-label="Edition date controls">
    <button class="ios6-btn" id="prevDay" type="button" aria-label="Previous day">Prev Day</button>
    <div class="date-shell">
      <label class="sr-only" for="editionDate">Edition date in New Zealand</label>
      <input type="date" id="editionDate">
    </div>
    <button class="ios6-btn is-today" id="todayBtn" type="button">Today</button>
    <button class="ios6-btn" id="nextDay" type="button" aria-label="Next day">Next Day</button>
    <div class="settings-menu" id="settingsMenu">
      <button class="ios6-btn settings-toggle" id="settingsToggle" type="button" aria-label="Front page settings" aria-expanded="false" aria-controls="settingsPanel">
        <svg class="settings-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.2 4.2h4.4M10.1 4.2h3.7M2.2 8h7.1M12.6 8h1.2M2.2 11.8h2.9M8.6 11.8h5.2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"/>
          <circle cx="8.1" cy="4.2" r="1.6" fill="currentColor"/>
          <circle cx="10.8" cy="8" r="1.6" fill="currentColor"/>
          <circle cx="6.5" cy="11.8" r="1.6" fill="currentColor"/>
        </svg>
      </button>
      <div class="settings-panel" id="settingsPanel" hidden>
        <p class="settings-title">Front Pages</p>
        <div class="settings-list" id="settingsList"></div>
        <p class="settings-note">At least one visible front page stays on.</p>
      </div>
    </div>
  </header>

  <section class="newsstand-scene" id="scene" aria-live="polite">
    <div class="shelf-papers" id="shelf"></div>
  </section>
  <section class="mobile-reader" id="mobileReader" aria-label="Mobile newspaper reader" aria-live="polite"></section>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-nav lightbox-nav-prev" id="lightboxPrev" type="button" aria-label="Previous page">&lt;</button>
  <button class="lightbox-nav lightbox-nav-next" id="lightboxNext" type="button" aria-label="Next page">&gt;</button>
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close expanded newspaper page">X</button>
  <div class="lightbox-spread is-cover" id="lightboxSpread" role="dialog" aria-modal="true" aria-label="Expanded newspaper page">
    <img class="lightbox-image" id="lightboxImageLeft" alt="">
    <img class="lightbox-image" id="lightboxImageRight" alt="" hidden>
  </div>
  <div class="lightbox-status" id="lightboxStatus" role="status" aria-live="polite" hidden></div>
</div>

<script>
// Core runtime configuration for the edition date rules and remote image requests.
const NZ_TIME_ZONE = "Pacific/Auckland";
const SCALE = 70;
const COVER_SCALE = 100;
// Desktop shelf positions are hand-tuned against the background image.
const SLOT_LAYOUTS = {
  4: [
    { left: "13%", width: "24%", rotate: "0deg", bottom: "19.9%", depth: 2 },
    { left: "37.67%", width: "24%", rotate: "0deg", bottom: "19.9%", depth: 3 },
    { left: "62.33%", width: "24%", rotate: "0deg", bottom: "19.9%", depth: 3 },
    { left: "87%", width: "24%", rotate: "0deg", bottom: "19.9%", depth: 2 }
  ],
  1: [
    { left: "50%", width: "31.5%", rotate: "0deg", bottom: "20%", depth: 3 }
  ],
  3: [
    { left: "17.2%", width: "26.8%", rotate: "0deg", bottom: "19.8%", depth: 2 },
    { left: "50%", width: "26.8%", rotate: "0deg", bottom: "19.8%", depth: 3 },
    { left: "82.8%", width: "26.8%", rotate: "0deg", bottom: "19.8%", depth: 2 }
  ],
  2: [
    { left: "33.8%", width: "29.8%", rotate: "0deg", bottom: "20%", depth: 2 },
    { left: "66.2%", width: "29.8%", rotate: "0deg", bottom: "20%", depth: 2 }
  ]
};

const EDITION_VISIBILITY_STORAGE_KEY = "nz-newsstand-visible-editions-v1";

const EDITION_CONFIG = {
  weekday: [
    { id: "1126", title: "New Zealand Herald" },
    { id: "1022", title: "The Post" },
    { id: "1272", title: "The Press" },
    { id: "9hym", title: "Otago Daily Times", coverScale: 100, interiorScale: 71 }
  ],
  saturday: [
    { id: "7478", title: "Weekend Herald" },
    { id: "1022", title: "The Post" },
    { id: "1272", title: "The Press" },
    { id: "9hym", title: "Otago Daily Times", coverScale: 100, interiorScale: 71 }
  ],
  sunday: [
    { id: "1211", title: "Herald on Sunday" },
    { id: "1543", title: "Sunday Star-Times" }
  ]
};

// DOM references are collected once because the app rewrites paper cards frequently.
const els = {
  editionDate: document.getElementById("editionDate"),
  prevDay: document.getElementById("prevDay"),
  todayBtn: document.getElementById("todayBtn"),
  nextDay: document.getElementById("nextDay"),
  settingsMenu: document.getElementById("settingsMenu"),
  settingsToggle: document.getElementById("settingsToggle"),
  settingsPanel: document.getElementById("settingsPanel"),
  settingsList: document.getElementById("settingsList"),
  scene: document.getElementById("scene"),
  shelf: document.getElementById("shelf"),
  mobileReader: document.getElementById("mobileReader"),
  lightbox: document.getElementById("lightbox"),
  lightboxPrev: document.getElementById("lightboxPrev"),
  lightboxNext: document.getElementById("lightboxNext"),
  lightboxClose: document.getElementById("lightboxClose"),
  lightboxSpread: document.getElementById("lightboxSpread"),
  lightboxStatus: document.getElementById("lightboxStatus"),
  lightboxImageLeft: document.getElementById("lightboxImageLeft"),
  lightboxImageRight: document.getElementById("lightboxImageRight")
};

let currentDate = formatNzDate(new Date());
let currentEditions = [];
let currentAvailableEditions = [];
let pageStateByEditionId = new Map();
let editionVisibilityById = loadEditionVisibility();
// Fullscreen reading mode keeps its own navigation model so the shelf can remain single-page.
let lightboxEditionId = null;
let lightboxPage = 1;
let lightboxLoading = false;
let lightboxRequestId = 0;
let lightboxReturnFocus = null;
// Phone navigation is intentionally independent from the desktop shelf/lightbox state.
let mobilePageStateByEditionId = new Map();
let mobileActiveEditionIndex = 0;
let mobileReaderObserver = null;
let mobileRenderId = 0;
let mobilePagePrefetchCache = new Map();

function isMobileMode() {
  return window.matchMedia("(max-width: 700px), (max-height: 500px) and (pointer: coarse)").matches;
}

function syncMobileViewportHeight() {
  // Pinch zoom also changes visualViewport.height. Reflowing the app to that
  // temporary magnified height fights Safari's native zoom and makes the page
  // appear to resize under the user's fingers. Keep the last 1x layout height
  // until the user returns to the normal zoom scale.
  if (window.visualViewport && window.visualViewport.scale > 1.01) return;
  const viewportHeight = window.visualViewport?.height || window.innerHeight;
  document.documentElement.style.setProperty("--mobile-viewport-height", `${Math.round(viewportHeight)}px`);
}

function loadEditionVisibility() {
  try {
    const raw = window.localStorage.getItem(EDITION_VISIBILITY_STORAGE_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return {};
    return Object.fromEntries(
      Object.entries(parsed).filter(([, value]) => typeof value === "boolean")
    );
  } catch {
    return {};
  }
}

function saveEditionVisibility() {
  try {
    window.localStorage.setItem(EDITION_VISIBILITY_STORAGE_KEY, JSON.stringify(editionVisibilityById));
  } catch {
    // Ignore storage failures; the shelf still works for the current session.
  }
}

function isEditionVisible(editionId) {
  return editionVisibilityById[editionId] !== false;
}

function setEditionVisibility(editionId, visible) {
  if (visible) {
    delete editionVisibilityById[editionId];
  } else {
    editionVisibilityById[editionId] = false;
  }
  saveEditionVisibility();
}

function formatNzDate(date) {
  const parts = new Intl.DateTimeFormat("en-NZ", {
    timeZone: NZ_TIME_ZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}

function getNzWeekday(date) {
  // Parse as UTC to avoid the viewer's local timezone shifting the intended NZ edition day.
  const [year, month, day] = String(date).split("-").map(Number);
  return new Date(Date.UTC(year, month - 1, day)).getUTCDay();
}

function shiftDate(date, offset) {
  const [year, month, day] = String(date).split("-").map(Number);
  const shifted = new Date(Date.UTC(year, month - 1, day));
  shifted.setUTCDate(shifted.getUTCDate() + offset);
  return formatUtcDate(shifted);
}

function formatUtcDate(date) {
  return [
    date.getUTCFullYear(),
    String(date.getUTCMonth() + 1).padStart(2, "0"),
    String(date.getUTCDate()).padStart(2, "0")
  ].join("-");
}

function resolveEditionsForDate(date) {
  const weekday = getNzWeekday(date);
  if (weekday === 0) return EDITION_CONFIG.sunday;
  if (weekday === 6) return EDITION_CONFIG.saturday;
  return EDITION_CONFIG.weekday;
}

function getPageScale(edition, page) {
  return page === 1
    ? (edition.coverScale ?? COVER_SCALE)
    : (edition.interiorScale ?? SCALE);
}

function buildFrontPageUrl(edition, date, page, scale = getPageScale(edition, page)) {
  // The remote source expects a compact issue date and a fixed trailing identifier segment.
  const issueDate = String(date).replace(/-/g, "");
  const file = `${edition.id}${issueDate}00000000001001`;
  return `https://t.prcdn.co/img?file=${file}&page=${page}&scale=${scale}`;
}

function buildPageUrlCandidates(edition, date, page) {
  const initialScale = getPageScale(edition, page);
  const scales = page === 1
    ? [initialScale]
    : [initialScale, initialScale - 10, initialScale - 20, initialScale - 30];
  return [...new Set(scales.filter((scale) => scale > 0))]
    .map((scale) => buildFrontPageUrl(edition, date, page, scale));
}

function createPageState() {
  // Each shelf card tracks its own loading lifecycle so cards can page independently.
  return {
    page: 1,
    lastSuccessfulPage: 1,
    hasLoaded: false,
    loading: false,
    requestId: 0,
    flashTimer: null
  };
}

function clearPageTimers() {
  pageStateByEditionId.forEach((state) => {
    if (state.flashTimer) {
      window.clearTimeout(state.flashTimer);
      state.flashTimer = null;
    }
  });
}

function getSlots(count) {
  return SLOT_LAYOUTS[count] || SLOT_LAYOUTS[3];
}

function ensureVisibleEditions(editions) {
  const visible = editions.filter((edition) => isEditionVisible(edition.id));
  if (visible.length || !editions.length) return visible;
  setEditionVisibility(editions[0].id, true);
  return [editions[0]];
}

function setSettingsOpen(isOpen) {
  els.settingsPanel.hidden = !isOpen;
  els.settingsToggle.setAttribute("aria-expanded", String(isOpen));
}

function renderSettingsPanel() {
  const editions = currentAvailableEditions.length ? currentAvailableEditions : resolveEditionsForDate(currentDate);
  const visibleCount = editions.filter((edition) => isEditionVisible(edition.id)).length;
  els.settingsList.innerHTML = "";

  editions.forEach((edition) => {
    const enabled = isEditionVisible(edition.id);
    const item = document.createElement("button");
    item.className = "settings-item";
    item.type = "button";
    item.disabled = enabled && visibleCount <= 1;
    item.classList.toggle("is-disabled", item.disabled);
    item.classList.toggle("is-off", !enabled);
    item.setAttribute("aria-pressed", String(enabled));

    item.addEventListener("click", () => {
      setEditionVisibility(edition.id, !enabled);
      renderSettingsPanel();
      renderCurrentDate();
    });

    const mark = document.createElement("span");
    mark.className = "settings-mark";
    mark.setAttribute("aria-hidden", "true");
    const label = document.createElement("span");
    label.textContent = edition.title;
    item.append(mark, label);
    els.settingsList.appendChild(item);
  });
}

function setPaperMessage(card, state, text, kind, persist) {
  const toast = card.querySelector(".paper-toast");
  if (state.flashTimer) {
    window.clearTimeout(state.flashTimer);
    state.flashTimer = null;
  }
  toast.textContent = text;
  toast.hidden = false;
  toast.classList.toggle("is-error", kind === "error");
  if (!persist) {
    state.flashTimer = window.setTimeout(() => {
      toast.hidden = true;
      toast.textContent = "";
      state.flashTimer = null;
    }, 1500);
  }
}

function hidePaperMessage(card, state) {
  const toast = card.querySelector(".paper-toast");
  if (state.flashTimer) {
    window.clearTimeout(state.flashTimer);
    state.flashTimer = null;
  }
  toast.hidden = true;
  toast.textContent = "";
  toast.classList.remove("is-error");
}

function updatePaperControls(card, state) {
  const prevButton = card.querySelector('[data-action="prev"]');
  const nextButton = card.querySelector('[data-action="next"]');
  const indicator = card.querySelector(".page-indicator");
  const showingUnavailablePage = state.hasLoaded && !state.loading && state.page !== state.lastSuccessfulPage;
  indicator.textContent = showingUnavailablePage ? `Page ${state.page} unavailable` : `Page ${state.page}`;
  prevButton.disabled = state.loading || state.page <= 1;
  nextButton.disabled = state.loading;
  card.classList.toggle("is-loading", state.loading);
  if (card.dataset.editionId === lightboxEditionId) {
    updateLightboxControls();
  }
}

function setPaperFallback(card, title) {
  const fallback = card.querySelector(".paper-fallback");
  fallback.textContent = title;
  fallback.hidden = false;
}

function clearPaperFallback(card) {
  const fallback = card.querySelector(".paper-fallback");
  fallback.hidden = true;
}

function getEditionById(editionId) {
  return currentEditions.find((item) => item.id === editionId) || null;
}

function buildPageAltText(edition, page) {
  return `${edition.title} page ${page} for ${currentDate}`;
}

function isMobileLightbox() {
  // Phones read one page at a time; a two-page spread is unreadable at phone widths.
  return window.matchMedia("(max-width: 700px)").matches;
}

function normalizeLightboxPage(page) {
  // Fullscreen mode treats page 1 as a standalone cover and subsequent navigation as even-numbered spreads.
  const normalized = Math.max(1, Number(page) || 1);
  if (isMobileLightbox()) return normalized;
  if (normalized === 1) return 1;
  return normalized % 2 === 0 ? normalized : normalized - 1;
}

function clearLightboxPages() {
  els.lightboxSpread.classList.add("is-cover");
  els.lightboxSpread.setAttribute("aria-label", "Expanded newspaper page");
  els.lightboxImageLeft.hidden = true;
  els.lightboxImageLeft.src = "";
  els.lightboxImageLeft.alt = "";
  els.lightboxImageRight.hidden = true;
  els.lightboxImageRight.src = "";
  els.lightboxImageRight.alt = "";
}

function setLightboxStatus(message) {
  els.lightboxStatus.textContent = message;
  els.lightboxStatus.hidden = !message;
}

function setLightboxPages(leftSrc, leftAlt, rightSrc, rightAlt) {
  const hasRightPage = Boolean(rightSrc);
  els.lightboxSpread.classList.toggle("is-cover", !hasRightPage);
  els.lightboxSpread.setAttribute("aria-label", hasRightPage ? "Expanded newspaper spread" : "Expanded newspaper page");
  els.lightboxImageLeft.hidden = !leftSrc;
  els.lightboxImageLeft.src = leftSrc || "";
  els.lightboxImageLeft.alt = leftAlt || "";
  els.lightboxImageRight.hidden = !hasRightPage;
  els.lightboxImageRight.src = rightSrc || "";
  els.lightboxImageRight.alt = rightAlt || "";
}

function updateLightboxControls() {
  const hasEdition = Boolean(lightboxEditionId);
  els.lightboxPrev.disabled = !hasEdition || lightboxLoading || lightboxPage <= 1;
  els.lightboxNext.disabled = !hasEdition || lightboxLoading;
}

function loadLightboxImage(url) {
  return new Promise((resolve, reject) => {
    const probe = new Image();
    probe.decoding = "async";
    probe.onload = () => resolve(url);
    probe.onerror = () => reject(new Error(`Failed to load ${url}`));
    probe.src = url;
  });
}

async function loadPageImageWithFallback(edition, date, page) {
  const candidates = buildPageUrlCandidates(edition, date, page);
  for (const url of candidates) {
    try {
      return await loadLightboxImage(url);
    } catch {
      // Interior pages retry three times in ten-point scale reductions before failing.
    }
  }
  throw new Error(`Page ${page} unavailable at all attempted scales`);
}

function loadLightboxSpread(editionId, targetPage) {
  const edition = getEditionById(editionId);
  if (!edition) return;

  // Ignore stale async image completions by advancing a request id on every navigation action.
  const startPage = normalizeLightboxPage(targetPage);
  const requestId = lightboxRequestId + 1;
  lightboxRequestId = requestId;
  lightboxLoading = true;
  setLightboxStatus(`Loading page ${startPage}`);
  updateLightboxControls();

  const leftAlt = buildPageAltText(edition, startPage);

  if (startPage === 1 || isMobileLightbox()) {
    loadPageImageWithFallback(edition, currentDate, startPage)
      .then((leftUrl) => {
        if (lightboxRequestId !== requestId) return;
        lightboxPage = startPage;
        lightboxLoading = false;
        setLightboxPages(leftUrl, leftAlt, "", "");
        setLightboxStatus("");
        updateLightboxControls();
      })
      .catch(() => {
        if (lightboxRequestId !== requestId) return;
        lightboxPage = startPage;
        lightboxLoading = false;
        setLightboxStatus(`Page ${startPage} unavailable`);
        updateLightboxControls();
      });
    return;
  }

  const rightPage = startPage + 1;
  const rightAlt = buildPageAltText(edition, rightPage);

  // The right-hand page may be unavailable, so the spread gracefully falls back to a single loaded page.
  loadPageImageWithFallback(edition, currentDate, startPage)
    .then((leftUrl) => Promise.all([
      Promise.resolve(leftUrl),
      loadPageImageWithFallback(edition, currentDate, rightPage).catch(() => "")
    ]))
    .then(([leftUrl, rightUrl]) => {
      if (lightboxRequestId !== requestId) return;
      lightboxPage = startPage;
      lightboxLoading = false;
      setLightboxPages(leftUrl, leftAlt, rightUrl, rightUrl ? rightAlt : "");
      setLightboxStatus(rightUrl ? "" : `Page ${rightPage} unavailable`);
      updateLightboxControls();
    })
    .catch(() => {
      if (lightboxRequestId !== requestId) return;
      lightboxPage = startPage;
      lightboxLoading = false;
      setLightboxStatus(`Page ${startPage} unavailable`);
      updateLightboxControls();
    });
}

function changeLightboxPage(delta) {
  if (!lightboxEditionId || lightboxLoading) return;
  // Phones step one page at a time; wider screens step 1 -> 2-3 -> 4-5 spreads.
  const targetPage = isMobileLightbox()
    ? Math.max(1, lightboxPage + delta)
    : delta < 0
      ? (lightboxPage <= 2 ? 1 : lightboxPage - 2)
      : (lightboxPage === 1 ? 2 : lightboxPage + 2);

  if (targetPage === lightboxPage) return;
  loadLightboxSpread(lightboxEditionId, targetPage);
}

function openLightbox(editionId, src, alt) {
  const state = pageStateByEditionId.get(editionId);
  const startPage = normalizeLightboxPage(state ? state.page : 1);
  lightboxEditionId = editionId;
  lightboxPage = startPage;
  lightboxLoading = false;
  lightboxReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  els.lightbox.hidden = false;
  document.body.style.overflow = "hidden";

  if (startPage === 1 && src) {
    setLightboxPages(src, alt || "", "", "");
    setLightboxStatus("");
  } else {
    clearLightboxPages();
    loadLightboxSpread(editionId, startPage);
  }

  updateLightboxControls();
  els.lightboxClose.focus();
}

function closeLightbox() {
  if (els.lightbox.hidden) return;
  const returnFocus = lightboxReturnFocus;
  lightboxEditionId = null;
  lightboxPage = 1;
  lightboxLoading = false;
  lightboxRequestId += 1;
  els.lightbox.hidden = true;
  clearLightboxPages();
  setLightboxStatus("");
  document.body.style.overflow = "";
  updateLightboxControls();
  lightboxReturnFocus = null;
  if (returnFocus && returnFocus.isConnected) returnFocus.focus();
}

function createPaperCard(edition, slot) {
  const card = document.createElement("article");
  card.className = "paper-card";
  card.dataset.editionId = edition.id;
  card.style.setProperty("--slot-left", slot.left);
  card.style.setProperty("--paper-width", slot.width);
  card.style.setProperty("--cover-rotate", slot.rotate);
  card.style.setProperty("--slot-bottom", slot.bottom);
  card.style.setProperty("--slot-depth", slot.depth);
  card.innerHTML = `
    <div class="paper-cover-wrap">
      <div class="paper-shadow"></div>
      <div class="paper-cover">
        <img class="paper-image" alt="${edition.title}" role="button" tabindex="0" aria-label="Open ${edition.title} reader">
        <div class="paper-fallback">Loading page 1</div>
        <div class="paper-toast" hidden></div>
      </div>
    </div>
    <div class="paper-controls">
      <button class="ios6-btn ios6-mini" type="button" data-action="prev" aria-label="Previous page for ${edition.title}">&lt;</button>
      <div class="page-indicator" aria-label="${edition.title} current page">Page 1</div>
      <button class="ios6-btn ios6-mini" type="button" data-action="next" aria-label="Next page for ${edition.title}">&gt;</button>
    </div>
  `;

  card.querySelector('[data-action="prev"]').addEventListener("click", () => {
    changePaperPage(edition.id, -1);
  });
  card.querySelector('[data-action="next"]').addEventListener("click", () => {
    changePaperPage(edition.id, 1);
  });
  card.querySelector(".paper-image").addEventListener("click", (event) => {
    const img = event.currentTarget;
    if (!img.classList.contains("is-visible") || !img.src) return;
    openLightbox(edition.id, img.src, img.alt);
  });
  card.querySelector(".paper-image").addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    event.currentTarget.click();
  });

  return card;
}

function applySuccessfulPaperLoad(card, edition, state, targetPage, url) {
  if (!card.isConnected) return;
  const img = card.querySelector(".paper-image");
  state.loading = false;
  state.page = targetPage;
  state.lastSuccessfulPage = targetPage;
  state.hasLoaded = true;
  img.src = url;
  img.alt = buildPageAltText(edition, targetPage);
  img.classList.add("is-visible");
  clearPaperFallback(card);
  hidePaperMessage(card, state);
  updatePaperControls(card, state);
}

function handlePaperLoadFailure(card, state, targetPage) {
  if (!card.isConnected) return;
  state.loading = false;
  // Keep the navigation cursor on the failed page. The previous successful
  // image remains visible, while Next can continue to targetPage + 1.
  state.page = targetPage;
  updatePaperControls(card, state);

  if (!state.hasLoaded) {
    setPaperFallback(card, targetPage === 1 ? "Issue unavailable" : `Page ${targetPage} unavailable`);
    return;
  }

  setPaperMessage(card, state, `Page ${targetPage} unavailable`, "error", false);
}

function loadPaperPage(card, edition, date, state, targetPage) {
  if (!card || state.loading) return;

  state.loading = true;
  state.page = targetPage;
  updatePaperControls(card, state);
  // Request ids make rapid paging safe by preventing old image loads from winning the race.
  const requestId = state.requestId + 1;
  state.requestId = requestId;

  if (state.hasLoaded) {
    setPaperMessage(card, state, `Loading page ${targetPage}`, "info", true);
  } else {
    setPaperFallback(card, `Loading page ${targetPage}`);
  }

  loadPageImageWithFallback(edition, date, targetPage)
    .then((url) => {
      if (state.requestId !== requestId) return;
      applySuccessfulPaperLoad(card, edition, state, targetPage, url);
    })
    .catch(() => {
      if (state.requestId !== requestId) return;
      handlePaperLoadFailure(card, state, targetPage);
    });
}

function changePaperPage(editionId, delta) {
  const state = pageStateByEditionId.get(editionId);
  const edition = currentEditions.find((item) => item.id === editionId);
  const card = els.shelf.querySelector(`[data-edition-id="${editionId}"]`);
  if (!state || !edition || !card) return;

  const targetPage = Math.max(1, state.page + delta);
  if (targetPage === state.page || state.loading) return;
  loadPaperPage(card, edition, currentDate, state, targetPage);
}

function changeAllVisiblePaperPages(delta) {
  // Main-view keyboard paging intentionally advances every visible edition together.
  currentEditions.forEach((edition) => {
    changePaperPage(edition.id, delta);
  });
}

function updateMobilePaperUi(paper, state) {
  if (!paper || !state) return;
  const previous = paper.querySelector('[data-mobile-action="prev"]');
  const next = paper.querySelector('[data-mobile-action="next"]');
  const label = paper.querySelector(".mobile-page-label");
  previous.disabled = state.loading || state.page <= 1;
  next.disabled = state.loading;
  label.textContent = `Page ${state.page}`;
  paper.classList.toggle("is-changing", state.loading);
}

function setMobilePaperStatus(paper, message, isError = false) {
  const status = paper.querySelector(".mobile-paper-status");
  status.textContent = message;
  status.hidden = !message;
  status.classList.toggle("is-error", isError);
}

function getMobilePageCacheKey(editionId, date, page) {
  return `${editionId}:${date}:${page}`;
}

function loadCachedMobilePage(edition, date, page) {
  const key = getMobilePageCacheKey(edition.id, date, page);
  if (mobilePagePrefetchCache.has(key)) return mobilePagePrefetchCache.get(key);
  const request = loadPageImageWithFallback(edition, date, page)
    .catch((error) => {
      // Failed lookahead requests are removable so a later explicit navigation
      // can retry instead of inheriting a permanently rejected cache entry.
      mobilePagePrefetchCache.delete(key);
      throw error;
    });
  mobilePagePrefetchCache.set(key, request);
  return request;
}

function prefetchNextMobilePage(edition, date, page) {
  loadCachedMobilePage(edition, date, page + 1).catch(() => {
    // Lookahead failure is silent; normal navigation owns user-facing errors.
  });
}

function loadMobilePaperPage(editionId, targetPage) {
  const edition = getEditionById(editionId);
  const state = mobilePageStateByEditionId.get(editionId);
  const paper = els.mobileReader.querySelector(`[data-edition-id="${editionId}"]`);
  if (!edition || !state || !paper || state.loading) return;

  const page = Math.max(1, targetPage);
  if (page === state.page && state.hasLoaded) return;
  state.loading = true;
  state.page = page;
  const requestId = state.requestId + 1;
  state.requestId = requestId;
  updateMobilePaperUi(paper, state);
  setMobilePaperStatus(paper, `Loading page ${page}`);

  const requestDate = currentDate;
  loadCachedMobilePage(edition, requestDate, page)
    .then((url) => {
      if (state.requestId !== requestId || !paper.isConnected) return;
      const image = paper.querySelector(".mobile-paper-image");
      state.loading = false;
      state.page = page;
      state.lastSuccessfulPage = page;
      state.hasLoaded = true;
      image.src = url;
      image.alt = buildPageAltText(edition, page);
      image.classList.add("is-visible");
      setMobilePaperStatus(paper, "");
      updateMobilePaperUi(paper, state);
      prefetchNextMobilePage(edition, requestDate, page);
    })
    .catch(() => {
      if (state.requestId !== requestId || !paper.isConnected) return;
      state.loading = false;
      state.page = page;
      setMobilePaperStatus(paper, page === 1 && !state.hasLoaded ? "Issue unavailable" : `Page ${page} unavailable`, true);
      updateMobilePaperUi(paper, state);
    });
}

function changeMobilePaperPage(editionId, delta) {
  const state = mobilePageStateByEditionId.get(editionId);
  if (!state || state.loading) return;
  const targetPage = Math.max(1, state.page + delta);
  if (targetPage === state.page) return;
  loadMobilePaperPage(editionId, targetPage);
}

function renderMobileReader(initialEditionIndex = 0) {
  mobileRenderId += 1;
  const renderId = mobileRenderId;
  if (mobileReaderObserver) {
    mobileReaderObserver.disconnect();
    mobileReaderObserver = null;
  }
  const clampedInitialIndex = Math.min(Math.max(0, initialEditionIndex), Math.max(0, currentEditions.length - 1));
  mobileActiveEditionIndex = clampedInitialIndex;
  mobilePagePrefetchCache = new Map();
  mobilePageStateByEditionId = new Map(currentEditions.map((edition) => [edition.id, createPageState()]));
  els.mobileReader.innerHTML = "";
  els.mobileReader.scrollTop = 0;

  currentEditions.forEach((edition, index) => {
    const paper = document.createElement("article");
    paper.className = "mobile-paper";
    paper.dataset.editionId = edition.id;
    paper.dataset.editionIndex = String(index);
    paper.setAttribute("aria-label", `${edition.title}, newspaper ${index + 1} of ${currentEditions.length}`);
    paper.innerHTML = `
      <div class="mobile-paper-topline">
        <span>${edition.title}</span>
        <span class="mobile-paper-position">${index + 1} of ${currentEditions.length}</span>
      </div>
      <img class="mobile-paper-image" alt="">
      <div class="mobile-paper-status" role="status">Loading page 1</div>
      <div class="mobile-paper-controls" aria-label="Page controls for ${edition.title}">
        <button class="mobile-page-button" type="button" data-mobile-action="prev" aria-label="Previous page for ${edition.title}">&lsaquo;</button>
        <span class="mobile-page-label">Page 1</span>
        <button class="mobile-page-button" type="button" data-mobile-action="next" aria-label="Next page for ${edition.title}">&rsaquo;</button>
      </div>
    `;
    paper.querySelector('[data-mobile-action="prev"]').addEventListener("click", () => changeMobilePaperPage(edition.id, -1));
    paper.querySelector('[data-mobile-action="next"]').addEventListener("click", () => changeMobilePaperPage(edition.id, 1));
    els.mobileReader.appendChild(paper);
  });

  // Day-to-day navigation keeps the same vertical newspaper position even
  // when the edition lineup changes (for example, Friday to Saturday).
  if (isMobileMode() && clampedInitialIndex > 0) {
    els.mobileReader.scrollTop = clampedInitialIndex * els.mobileReader.clientHeight;
  }

  mobileReaderObserver = new IntersectionObserver((entries) => {
    const visible = entries
      .filter((entry) => entry.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!visible) return;
    mobileActiveEditionIndex = Number(visible.target.dataset.editionIndex) || 0;
  }, { root: els.mobileReader, threshold: [0.55, 0.75] });
  els.mobileReader.querySelectorAll(".mobile-paper").forEach((paper) => mobileReaderObserver.observe(paper));

  if (!isMobileMode()) return;
  currentEditions.forEach((edition) => {
    if (renderId !== mobileRenderId) return;
    loadMobilePaperPage(edition.id, 1);
  });
}

function renderShelf(date, options = {}) {
  // Changing the date rebuilds the shelf from scratch because the set of editions can change by weekday.
  const initialMobileEditionIndex = options.preserveMobileEdition
    ? mobileActiveEditionIndex
    : 0;
  clearPageTimers();
  currentDate = date;
  currentAvailableEditions = resolveEditionsForDate(date);
  currentEditions = ensureVisibleEditions(currentAvailableEditions);
  pageStateByEditionId = new Map(currentEditions.map((edition) => [edition.id, createPageState()]));
  els.scene.dataset.count = String(currentEditions.length);
  els.shelf.innerHTML = "";
  renderSettingsPanel();

  const slots = getSlots(currentEditions.length);
  currentEditions.forEach((edition, index) => {
    const card = createPaperCard(edition, slots[index]);
    els.shelf.appendChild(card);
  });

  renderMobileReader(initialMobileEditionIndex);

  if (!isMobileMode()) {
    currentEditions.forEach((edition) => {
      const state = pageStateByEditionId.get(edition.id);
      const card = els.shelf.querySelector(`[data-edition-id="${edition.id}"]`);
      updatePaperControls(card, state);
      loadPaperPage(card, edition, currentDate, state, 1);
    });
  }
}

function renderCurrentDate(options = {}) {
  renderShelf(els.editionDate.value, options);
}

els.editionDate.value = currentDate;
els.prevDay.addEventListener("click", () => {
  els.editionDate.value = shiftDate(els.editionDate.value, -1);
  renderCurrentDate({ preserveMobileEdition: true });
});
els.todayBtn.addEventListener("click", () => {
  els.editionDate.value = formatNzDate(new Date());
  renderCurrentDate();
});
els.nextDay.addEventListener("click", () => {
  els.editionDate.value = shiftDate(els.editionDate.value, 1);
  renderCurrentDate({ preserveMobileEdition: true });
});
els.editionDate.addEventListener("change", renderCurrentDate);
els.settingsToggle.addEventListener("click", (event) => {
  event.stopPropagation();
  if (els.settingsPanel.hidden) {
    renderSettingsPanel();
  }
  setSettingsOpen(els.settingsPanel.hidden);
});
els.settingsMenu.addEventListener("click", (event) => {
  event.stopPropagation();
});
document.addEventListener("click", () => {
  if (!els.settingsPanel.hidden) setSettingsOpen(false);
});
els.lightboxPrev.addEventListener("click", () => {
  changeLightboxPage(-1);
});
els.lightboxNext.addEventListener("click", () => {
  changeLightboxPage(1);
});
els.lightboxClose.addEventListener("click", closeLightbox);
els.lightbox.addEventListener("click", (event) => {
  if (event.target === els.lightbox) {
    closeLightbox();
  }
});

// The phone surface lets the browser own vertical scrolling and interprets only
// clearly horizontal single-finger gestures as page changes.
let mobileTouchStartX = 0;
let mobileTouchStartY = 0;
let mobileTouchEditionId = null;
els.mobileReader.addEventListener("touchstart", (event) => {
  if (event.touches.length !== 1) {
    mobileTouchEditionId = null;
    return;
  }
  const paper = event.target.closest(".mobile-paper");
  if (!paper) return;
  mobileTouchStartX = event.touches[0].clientX;
  mobileTouchStartY = event.touches[0].clientY;
  mobileTouchEditionId = paper.dataset.editionId;
}, { passive: true });
els.mobileReader.addEventListener("touchmove", (event) => {
  // Once a second finger joins, this interaction is a pinch/pan gesture and
  // must never turn into a page change when either finger is released.
  if (event.touches.length !== 1) mobileTouchEditionId = null;
}, { passive: true });
els.mobileReader.addEventListener("touchend", (event) => {
  if (!mobileTouchEditionId || !event.changedTouches.length) return;
  const editionId = mobileTouchEditionId;
  mobileTouchEditionId = null;
  const touch = event.changedTouches[0];
  const dx = touch.clientX - mobileTouchStartX;
  const dy = touch.clientY - mobileTouchStartY;
  if (Math.abs(dx) < 44 || Math.abs(dx) < Math.abs(dy) * 1.25) return;
  changeMobilePaperPage(editionId, dx < 0 ? 1 : -1);
}, { passive: true });
els.mobileReader.addEventListener("touchcancel", () => {
  mobileTouchEditionId = null;
}, { passive: true });

// Horizontal swipe pages the reader on touch devices; pinch (multi-touch) is ignored so zoom still works.
let touchStartX = 0;
let touchStartY = 0;
let touchTracking = false;
els.lightboxSpread.addEventListener("touchstart", (event) => {
  if (event.touches.length !== 1) {
    touchTracking = false;
    return;
  }
  touchStartX = event.touches[0].clientX;
  touchStartY = event.touches[0].clientY;
  touchTracking = true;
}, { passive: true });
els.lightboxSpread.addEventListener("touchend", (event) => {
  if (!touchTracking) return;
  touchTracking = false;
  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;
  // Require a clearly horizontal flick so vertical scroll/pinch is not mistaken for paging.
  if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  changeLightboxPage(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener("keydown", (event) => {
  if (!els.settingsPanel.hidden && event.key === "Escape") {
    setSettingsOpen(false);
    return;
  }
  // Fullscreen shortcuts take precedence; otherwise the same arrows page every visible paper on the shelf.
  if (!els.lightbox.hidden && (event.key === "ArrowLeft" || event.key === "Left")) {
    event.preventDefault();
    changeLightboxPage(-1);
    return;
  }
  if (!els.lightbox.hidden && (event.key === "ArrowRight" || event.key === "Right")) {
    event.preventDefault();
    changeLightboxPage(1);
    return;
  }
  if (event.key === "Escape" && !els.lightbox.hidden) {
    closeLightbox();
    return;
  }
  if (!els.lightbox.hidden && event.key === "Tab") {
    const focusable = [els.lightboxPrev, els.lightboxNext, els.lightboxClose].filter((item) => !item.disabled);
    const currentIndex = focusable.indexOf(document.activeElement);
    const nextIndex = event.shiftKey
      ? (currentIndex <= 0 ? focusable.length - 1 : currentIndex - 1)
      : (currentIndex < 0 || currentIndex === focusable.length - 1 ? 0 : currentIndex + 1);
    event.preventDefault();
    focusable[nextIndex].focus();
    return;
  }
  if (event.target instanceof HTMLInputElement || event.target instanceof HTMLButtonElement || event.target?.getAttribute("role") === "button") {
    return;
  }
  if (els.lightbox.hidden && (event.key === "ArrowLeft" || event.key === "Left")) {
    event.preventDefault();
    changeAllVisiblePaperPages(-1);
    return;
  }
  if (els.lightbox.hidden && (event.key === "ArrowRight" || event.key === "Right")) {
    event.preventDefault();
    changeAllVisiblePaperPages(1);
    return;
  }
});

const mobileModeQuery = window.matchMedia("(max-width: 700px), (max-height: 500px) and (pointer: coarse)");
mobileModeQuery.addEventListener("change", () => {
  syncMobileViewportHeight();
  closeLightbox();
  renderShelf(currentDate);
});

// iOS Safari's expanded bottom toolbar can cover part of 100dvh. The visual
// viewport reports the genuinely visible height and changes as browser chrome
// expands or collapses, so keep the mobile shell in sync with it.
let mobileViewportFrame = 0;
function scheduleMobileViewportSync() {
  window.cancelAnimationFrame(mobileViewportFrame);
  mobileViewportFrame = window.requestAnimationFrame(syncMobileViewportHeight);
}
window.addEventListener("resize", scheduleMobileViewportSync, { passive: true });
window.visualViewport?.addEventListener("resize", scheduleMobileViewportSync, { passive: true });
window.visualViewport?.addEventListener("scroll", scheduleMobileViewportSync, { passive: true });

syncMobileViewportHeight();
renderShelf(currentDate);
</script>
</body>
</html>
